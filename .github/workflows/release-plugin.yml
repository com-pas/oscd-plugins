name: Release Plugin

on:
  workflow_dispatch:
    inputs:
      PLUGIN_NAME_TO_RELEASE:
        description: 'Name of the plugin to release (e.g., oscd-publisher)'
        required: true
        type: choice
        options:
          - oscd-publisher
      RELEASE_TYPE:
        description: 'Release type: MAJOR, MINOR, or PATCH'
        required: false
        type: choice
        options:
          - MINOR
          - MAJOR
          - PATCH
        default: 'MINOR'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
    
    steps:
      - name: Checkout gh-pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Fetch main and tags
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch origin '+refs/tags/*:refs/tags/*'

      - name: Check that a new release can be published
        id: preflight
        env:
          PLUGIN_NAME: ${{ github.event.inputs.PLUGIN_NAME_TO_RELEASE }}
        run: |
          set -euo pipefail
          sha_file="compas/plugins/SNAPSHOT_SHA"
          if [ ! -f "$sha_file" ]; then
            echo "compas/plugins/SNAPSHOT_SHA is missing. Nothing is published."
            exit 1
          fi
          snapshot_sha=$(tr -d '[:space:]' < "$sha_file")
          if ! [[ "$snapshot_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "compas/plugins/SNAPSHOT_SHA is not a commit SHA. Nothing is published."
            exit 1
          fi
          if ! git cat-file -e "${snapshot_sha}^{commit}" 2>/dev/null; then
            echo "SNAPSHOT_SHA ${snapshot_sha} is not a commit. Nothing is published."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$snapshot_sha" origin/main; then
            echo "SNAPSHOT_SHA ${snapshot_sha} is not on main. Nothing is published."
            exit 1
          fi

          snapshot="compas/plugins/${PLUGIN_NAME}/snapshot/index.js"
          if [ ! -f "$snapshot" ]; then
            echo "Snapshot index.js is missing at ${snapshot}. Nothing is published."
            exit 1
          fi
          snapshot_pkg="compas/plugins/${PLUGIN_NAME}/snapshot/package.json"
          if [ ! -f "$snapshot_pkg" ]; then
            echo "Snapshot package.json is missing at ${snapshot_pkg}. Nothing is published."
            exit 1
          fi

          existing_tags=$(git tag --points-at "$snapshot_sha" | grep -E "^${PLUGIN_NAME}-[0-9]+\.[0-9]+\.[0-9]+$" || true)
          if [ -n "$existing_tags" ]; then
            echo "${PLUGIN_NAME} is already tagged on ${snapshot_sha}:"
            echo "$existing_tags"
            echo "Nothing is published."
            exit 1
          fi

          for dir in "compas/plugins/${PLUGIN_NAME}"/*/ ; do
            [ -d "$dir" ] || continue
            version=$(basename "$dir")
            if [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] && [ -f "${dir}index.js" ]; then
              if cmp -s "$snapshot" "${dir}index.js"; then
                echo "Snapshot index.js is already published as ${PLUGIN_NAME}/${version}. Nothing is published."
                exit 1
              fi
            fi
          done

          echo "SNAPSHOT_SHA=${snapshot_sha}" >> "$GITHUB_OUTPUT"

      - name: Find last release version
        id: find_last_version
        run: |
          #!/bin/bash
          set -e
          
          PLUGIN_NAME="${{ github.event.inputs.PLUGIN_NAME_TO_RELEASE }}"
          PLUGIN_DIR="compas/plugins/$PLUGIN_NAME"
          
          echo "Searching for semver directories in: $PLUGIN_DIR"
          
          # Array to store found versions
          versions=()
          
          # Check if plugin directory exists
          if [ -d "$PLUGIN_DIR" ]; then
            # Find all directories and check if they match semver pattern
            for dir in "$PLUGIN_DIR"/*/ ; do
              [ -d "$dir" ] || continue
              dirname=$(basename "$dir")
              
              # Check if directory name matches semver pattern (X.Y.Z)
              if [[ $dirname =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
                echo "Found semver directory: $dirname"
                versions+=("$dirname")
              fi
            done
          else
            echo "Plugin directory $PLUGIN_DIR not found"
          fi
          
          # Determine the latest version
          if [ ${#versions[@]} -eq 0 ]; then
            LAST_RELEASE_VERSION="0.0.0"
            echo "No semver directories found. Using default version: $LAST_RELEASE_VERSION"
          else
            # Sort versions semantically and get the latest
            LAST_RELEASE_VERSION=$(printf '%s\n' "${versions[@]}" | sort -V | tail -n 1)
            echo "Found ${#versions[@]} semver directories"
            echo "Latest version: $LAST_RELEASE_VERSION"
          fi
          
          echo "LAST_RELEASE_VERSION=$LAST_RELEASE_VERSION" >> $GITHUB_OUTPUT

      - name: Calculate new version
        id: calculate_new_version
        run: |
          #!/bin/bash
          set -e

          PLUGIN_NAME="${{ github.event.inputs.PLUGIN_NAME_TO_RELEASE }}"
          RELEASE_TYPE="${{ github.event.inputs.RELEASE_TYPE }}"
          LAST_VERSION="${{ steps.find_last_version.outputs.LAST_RELEASE_VERSION }}"

          echo "Plugin to release: $PLUGIN_NAME"
          echo "Release type: $RELEASE_TYPE"
          echo "Last published version: $LAST_VERSION"
          
          # Parse semantic version (MAJOR.MINOR.PATCH)
          if [[ $LAST_VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
          else
            echo "Invalid version format: $LAST_VERSION, using 0.0.0"
            MAJOR=0
            MINOR=0
            PATCH=0
          fi
          
          # Calculate new version based on RELEASE_TYPE
          case "$RELEASE_TYPE" in
            MAJOR)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            MINOR)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            PATCH)
              PATCH=$((PATCH + 1))
              ;;
            *)
              echo "Invalid RELEASE_TYPE: $RELEASE_TYPE, using MINOR"
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
          esac
          
          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "New version: $NEW_VERSION"
          
          # Export variables for next steps
          echo "NEW_RELEASE_VERSION=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Ensure tag name and version folder are free
        env:
          PLUGIN_NAME: ${{ github.event.inputs.PLUGIN_NAME_TO_RELEASE }}
          NEW_RELEASE_VERSION: ${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}
        run: |
          set -euo pipefail
          tag="${PLUGIN_NAME}-${NEW_RELEASE_VERSION}"
          if git show-ref --verify --quiet "refs/tags/${tag}"; then
            echo "Tag ${tag} already exists and points at $(git rev-list -n 1 "$tag"). Nothing is published."
            exit 1
          fi
          if [ -e "compas/plugins/${PLUGIN_NAME}/${NEW_RELEASE_VERSION}" ]; then
            echo "Version folder ${PLUGIN_NAME}/${NEW_RELEASE_VERSION} already exists. Nothing is published."
            exit 1
          fi

      - name: Release plugin
        id: release_plugin
        run: |
          #!/bin/bash
          set -e

          PLUGIN_NAME="${{ github.event.inputs.PLUGIN_NAME_TO_RELEASE }}"
          NEW_RELEASE_VERSION="${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}"

          echo "Plugin to release: $PLUGIN_NAME"
          echo "New version: $NEW_RELEASE_VERSION"

          # Create new directory for the plugin version
          NEW_PLUGIN_DIR="compas/plugins/$PLUGIN_NAME/$NEW_RELEASE_VERSION"
          mkdir -p "$NEW_PLUGIN_DIR"

          # Copy the whole snapshot so extra files keep the same relative paths.
          # Set only the released package.json version. The snapshot copy stays as built.
          cp -r "compas/plugins/$PLUGIN_NAME/snapshot/." "$NEW_PLUGIN_DIR/"
          node -e 'const fs=require("fs"); const file=process.argv[1]; const version=process.argv[2]; const pkg=JSON.parse(fs.readFileSync(file,"utf8")); pkg.version=version; fs.writeFileSync(file, JSON.stringify(pkg,null,2)+"\n");' "$NEW_PLUGIN_DIR/package.json" "$NEW_RELEASE_VERSION"

          echo "Plugin $PLUGIN_NAME version $NEW_RELEASE_VERSION released successfully"

      - name: Commit and Push Changes
        env:
          PLUGIN_NAME: ${{ github.event.inputs.PLUGIN_NAME_TO_RELEASE }}
          NEW_RELEASE_VERSION: ${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add "compas/plugins/${PLUGIN_NAME}/${NEW_RELEASE_VERSION}"
          git status
          git commit -m "Deploy ${PLUGIN_NAME} version ${NEW_RELEASE_VERSION} to gh-pages"
          git push origin gh-pages

      - name: Tag released version
        env:
          PLUGIN_NAME: ${{ github.event.inputs.PLUGIN_NAME_TO_RELEASE }}
          NEW_RELEASE_VERSION: ${{ steps.calculate_new_version.outputs.NEW_RELEASE_VERSION }}
          SNAPSHOT_SHA: ${{ steps.preflight.outputs.SNAPSHOT_SHA }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          tag="${PLUGIN_NAME}-${NEW_RELEASE_VERSION}"
          echo "Tagging ${tag} at ${SNAPSHOT_SHA}"
          git tag -a "$tag" "$SNAPSHOT_SHA" -m "Release ${PLUGIN_NAME} ${NEW_RELEASE_VERSION}"
          git push origin "$tag"
