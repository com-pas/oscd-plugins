name: Build and Deploy Plugins

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository (Main Branch)
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.20.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Project
        run: pnpm run build

      - name: Run verify (lint, check, test)
        run: pnpm run verify

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          if-no-files-found: warn

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - name: Checkout gh-pages Branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Download Build Artifact
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Copy Built Files to Plugins Folder
        run: |
          mkdir -p compas/plugins
          # Nest each build under snapshot/ so index.js has the same path depth
          # as compas/plugins/<plugin>/<version>/index.js. Relative ../ loads
          # then resolve the same way. Leave any old flat index.js in place.
          for app in dist/apps/*; do
            [ -d "$app" ] || continue
            name=$(basename "$app")
            dest="compas/plugins/${name}/snapshot"
            mkdir -p "$dest"
            cp -r "$app"/. "$dest"/
          done

      - name: Commit and Push Changes
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          # The release workflow tags this SHA. Leave it in place when the copied
          # build output is unchanged, so a docs-only main push does not move it.
          changes=$(git status --porcelain -- compas/plugins | grep -v -F 'compas/plugins/SNAPSHOT_SHA' || true)
          if [ -n "$changes" ]; then
            printf '%s\n' "$SOURCE_SHA" > compas/plugins/SNAPSHOT_SHA
            git add compas/plugins
            git commit -m "Deploy latest build to plugins"
          else
            echo "Build output unchanged. SNAPSHOT_SHA left as-is."
          fi
          git push origin gh-pages
